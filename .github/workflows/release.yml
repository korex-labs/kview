name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

env:
  TAG_NAME: ${{ github.ref_name }}

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Go module major path
        run: sh scripts/validate-go-module-tag.sh --strict "$TAG_NAME"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: ${{ runner.os }}-kview-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('Dockerfile', 'go.sum', 'ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kview-${{ matrix.goos }}-${{ matrix.goarch }}-
            ${{ runner.os }}-kview-

      - name: Set toolchain image
        run: echo "TOOLCHAIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/toolchain:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build release binary in Docker
        run: |
          make build-release \
            DOCKER_BUILD=0 \
            DOCKER_IMAGE="$TOOLCHAIN_IMAGE" \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }} \
            OUTPUT="dist/kview-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

      - name: Verify Windows icon resource
        if: matrix.goos == 'windows'
        run: |
          binary="dist/kview-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          file "$binary"
          python3 scripts/verify-windows-resources.py "$binary"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kview-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kview-${{ env.TAG_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  build-webview-linux:
    name: Build linux-amd64 webview
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: ${{ runner.os }}-kview-webview-linux-amd64-${{ hashFiles('Dockerfile', 'go.sum', 'ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kview-webview-linux-amd64-
            ${{ runner.os }}-kview-webview-
            ${{ runner.os }}-kview-

      - name: Set toolchain image
        run: echo "TOOLCHAIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/toolchain:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build release webview binary in Docker
        run: make build-webview-release DOCKER_BUILD=0 DOCKER_IMAGE="$TOOLCHAIN_IMAGE" GOOS=linux GOARCH=amd64 OUTPUT="dist/kview-${TAG_NAME}-linux-amd64-webview"

      - name: Package Linux desktop bundle
        run: |
          scripts/package-linux-desktop.sh \
            "dist/kview-${TAG_NAME}-linux-amd64-webview" \
            "$TAG_NAME" \
            amd64 \
            "dist/kview-${TAG_NAME}-linux-amd64-desktop.tar.gz"

      - name: Upload webview binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kview-linux-amd64-webview
          path: |
            dist/kview-${{ env.TAG_NAME }}-linux-amd64-webview
            dist/kview-${{ env.TAG_NAME }}-linux-amd64-desktop.tar.gz
          if-no-files-found: error

  build-webview-macos:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }} webview
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build release webview binary natively
        run: make local-build-webview-release GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} OUTPUT="dist/kview-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}-webview"

      - name: Ad-hoc sign and inspect binary
        run: |
          binary="dist/kview-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}-webview"
          codesign --force --sign - "$binary"
          codesign --verify --verbose "$binary"
          file "$binary"
          otool -L "$binary"
          "$binary" --version

      - name: Package macOS app bundle
        run: |
          scripts/package-macos-app.sh \
            "dist/kview-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}-webview" \
            "$TAG_NAME" \
            ${{ matrix.goarch }} \
            "dist/kview-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}-app.zip"

      - name: Upload webview binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kview-${{ matrix.goos }}-${{ matrix.goarch }}-webview
          path: |
            dist/kview-${{ env.TAG_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}-webview
            dist/kview-${{ env.TAG_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}-app.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - build-webview-linux
      - build-webview-macos
    # Required for gh release create/upload on v* tag pushes.
    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GH_REPO"; then
            gh release upload "$TAG_NAME" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes --repo "$GH_REPO"
          fi
