name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Go module major path
        run: sh scripts/validate-go-module-tag.sh "${{ github.ref_name }}"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore build caches
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .cache
          key: ${{ runner.os }}-kview-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('Dockerfile', 'go.sum', 'ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kview-${{ matrix.goos }}-${{ matrix.goarch }}-
            ${{ runner.os }}-kview-

      - name: Set toolchain image
        run: echo "TOOLCHAIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/toolchain:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build release binary in Docker
        run: make build-release DOCKER_BUILD=0 DOCKER_IMAGE="$TOOLCHAIN_IMAGE" GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} OUTPUT=dist/kview-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kview-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kview-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  build-webview-linux:
    name: Build linux-amd64 webview
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore build caches
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .cache
          key: ${{ runner.os }}-kview-webview-linux-amd64-${{ hashFiles('Dockerfile', 'go.sum', 'ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-kview-webview-linux-amd64-
            ${{ runner.os }}-kview-webview-
            ${{ runner.os }}-kview-

      - name: Set toolchain image
        run: echo "TOOLCHAIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/toolchain:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build release webview binary in Docker
        run: make build-webview-release DOCKER_BUILD=0 DOCKER_IMAGE="$TOOLCHAIN_IMAGE" GOOS=linux GOARCH=amd64 OUTPUT=dist/kview-${{ github.ref_name }}-linux-amd64-webview

      - name: Upload webview binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kview-linux-amd64-webview
          path: dist/kview-${{ github.ref_name }}-linux-amd64-webview
          if-no-files-found: error

  build-webview-macos:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }} webview
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build release webview binary natively
        run: make local-build-webview-release GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} OUTPUT=dist/kview-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}-webview

      - name: Ad-hoc sign and inspect binary
        run: |
          binary="dist/kview-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}-webview"
          codesign --force --sign - "$binary"
          codesign --verify --verbose "$binary"
          file "$binary"
          otool -L "$binary"
          "$binary" --version

      - name: Upload webview binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kview-${{ matrix.goos }}-${{ matrix.goarch }}-webview
          path: dist/kview-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}-webview
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - build-webview-linux
      - build-webview-macos
    # Required for gh release create/upload on v* tag pushes.
    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GH_REPO"; then
            gh release upload "$TAG_NAME" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes --repo "$GH_REPO"
          fi
