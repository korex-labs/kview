name: OpenSSF Scorecard

on:
  push:
    branches:
      - master
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  scorecard:
    name: Run OpenSSF Scorecard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          if-no-files-found: error

  publish:
    name: Publish Scorecard results
    runs-on: ubuntu-latest
    needs: scorecard
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download Scorecard results artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scorecard-sarif
          path: results

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          sarif_file: results/scorecard.sarif
